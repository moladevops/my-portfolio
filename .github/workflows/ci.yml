name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
            docker build -t moladevops237/portfolio:${{ github.run_number }} .
            docker build -t moladevops237/portfolio .

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.REGISTRY_PASS }}" | docker login -u moladevops237 --password-stdin

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
            docker push moladevops237/portfolio:${{ github.run_number }}
            docker push moladevops237/portfolio 