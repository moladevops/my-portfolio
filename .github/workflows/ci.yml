name: CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t moladevops237/portfolio:${{ github.run_number }} \
            -t moladevops237/portfolio:latest \
            .

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.REGISTRY_PASS }}" | \
          docker login -u moladevops237 --password-stdin

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push moladevops237/portfolio:${{ github.run_number }}
          docker push moladevops237/portfolio:latest


  # Static site: built on every push and pull request,
  # deployed to S3 + CloudFront on main once the AWS variables are set (see infra/).
  static-site:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # OIDC: GitHub proves its identity to AWS, no stored AWS keys

    env:
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build static site
        run: |
          pip install -r requirements.txt
          python scripts/build_static.py dist

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload to S3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.S3_BUCKET != ''
        run: aws s3 sync dist "s3://$S3_BUCKET" --delete

      - name: Invalidate CloudFront cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.S3_BUCKET != ''
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
